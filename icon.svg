
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#092c55"/>
      <stop offset="1" stop-color="#020713"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8f8ff"/>
      <stop offset=".35" stop-color="#254c70"/>
      <stop offset=".7" stop-color="#071a30"/>
      <stop offset="1" stop-color="#70dfff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#baf8ff"/>
      <stop offset=".7" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#0060d8"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <g filter="url(#glow)" fill="none" stroke="#00baff">
    <circle cx="256" cy="256" r="207" stroke-width="5"/>
    <circle cx="256" cy="256" r="183" stroke-width="3"/>
  </g>

  <circle cx="256" cy="256" r="166"
    fill="none" stroke="url(#metal)" stroke-width="23"/>

  <circle cx="256" cy="256" r="143"
    fill="none" stroke="#087acb" stroke-width="5"/>

  <g fill="none" stroke="url(#metal)" stroke-width="15"
     stroke-linejoin="round">
    <path d="M256 100 L410 365 L102 365 Z"/>
  </g>

  <g fill="none" stroke="#00cfff" stroke-width="8"
     stroke-linejoin="round" filter="url(#glow)">
    <path d="M256 126 L386 350 L126 350 Z"/>
  </g>

  <g fill="#24cfff" opacity=".9">
    <path d="M244 77h24v38h-24z"/>
    <path d="M244 397h24v38h-24z"/>
    <path d="M72 244h38v24H72z"/>
    <path d="M402 244h38v24h-38z"/>
  </g>

  <circle cx="256" cy="256" r="75"
    fill="#062b50" stroke="#00cfff" stroke-width="12"
    filter="url(#glow)"/>

  <circle cx="256" cy="256" r="54"
    fill="url(#core)" filter="url(#glow)"/>

  <circle cx="256" cy="256" r="31"
    fill="#ffffff" opacity=".9"/>

  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <g fill="#8ceeff">
    <circle cx="256" cy="49" r="5"/>
    <circle cx="256" cy="463" r="5"/>
    <circle cx="49" cy="256" r="5"/>
    <circle cx="463" cy="256" r="5"/>
  </g>
</svg>
